<!doctype html>
<html>

<head>

    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<body class="bg-white text-gray-900  dark:bg-black dark:text-gray-100">
    <header class="sticky top-0 z-50">
        <nav
            class="flex items-center justify-between px-6 py-16.75 md:px-20 bg-white/40 dark:bg-black/70 backdrop-blur-lg text-black dark:text-white transition-all duration-500 ease-in">

            <!-- Logo -->

            <!-- Hamburger -->
            <div class="md:hidden flex items-center text-black dark:text-white">

            <div class="hidden md:flex items-center gap-12">

                </ul>

    </header>


    <main>

        <!-- Hero-Section -->

        <!-- Hero-Text Section -->
        <section class="px-6 md:px-20 pt-12 md:pt-20 max-w-4xl">
            <h1 class="heading">
                Elevate Your Brand to Asgardian Heights.
            </h1>

            <p class="desc">At Asgard We believe you all are You are our guest.
                We prioritize design to deliver excellence, every single time</p>

            <button class="btn  text-base mt-6 md:px-8 md:py-5 md:text-xl">Learn More >></button>
        </section>

        <!--  hero Image Section -->
        <section class="mt-12 px-6 md:mt-20 md:px-20">
            <img class="w-7xl h-auto rounded-lg object-contain" src="./Images/Hero_Image.png" alt="main_image" />

    </main>

</html>
